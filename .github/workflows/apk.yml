name: Gerar APK

# - Push na main: gera o APK assinado e deixa em Actions › Artifacts.
# - Tag "v*" (ex.: v1.3): gera o APK e publica uma Release com ele para download.
# - Pull requests e forks: só compilam (sem a chave oficial), para conferir se o código está ok.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar assinatura oficial
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltam os secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          mkdir -p app/assinatura
          echo "$KEYSTORE_BASE64" | base64 -d > app/assinatura/corrida-particular.jks

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
            NOME="CorridaParticular-${GITHUB_REF_NAME//\//-}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$NOME"
            echo "APK=$NOME" >> "$GITHUB_ENV"
          fi

      - name: Remover chave do disco
        if: always()
        run: rm -f app/assinatura/corrida-particular.jks

      - name: Disponibilizar APK (Artifacts)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CorridaParticular-apk
          path: ${{ env.APK }}

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
